{% extends 'base.html' %}
{% block title %}ตรวจสอบสลิป | Mood Café{% endblock %}
{% block content %}
<section class="admin-slip-page">
    <div class="admin-slip-heading">
        <div>
            <p class="eyebrow">MOOD CAFÉ / PAYMENT</p>
            <h1>ตรวจสอบสลิปการชำระเงิน</h1>
            <p>ตรวจสอบรายละเอียดการโอนก่อนยืนยันรับชำระเงิน</p>
        </div>
        <a class="button button-outline" href="{{ url_for('admin_orders') }}">กลับหน้ารายการออร์เดอร์</a>
    </div>
    <figure class="admin-slip-frame">
        <img src="{{ image_url }}" alt="สลิปการชำระเงิน {{ filename }}">
        <figcaption>{{ filename }}</figcaption>
    </figure>
    <div class="admin-slip-actions">
        <button class="button button-dark" type="button" onclick="if (history.length > 1) { history.back(); } else { location.href='{{ url_for('admin_orders') }}'; }">กลับหน้าก่อนหน้า</button>
        <a class="text-link" href="{{ url_for('admin_orders') }}">กลับหน้าติดตามออร์เดอร์</a>
    </div>
</section>
{% endblock %}
